worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Docker Compose mounts a writable tmpfs at /tmp for this read-only
    # container. Keep paths directly beneath that mount so nginx can create
    # them at boot instead of relying on image-layer directories hidden by the
    # tmpfs mount.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        # Archive intake performs its own streamed 128 MiB enforcement.  Keep
        # nginx from rejecting a permitted local upload at its 1 MiB default or
        # buffering the body into the read-only web container's tmpfs.
        client_max_body_size 128m;

        include security-headers.conf;

        location = /healthz {
            access_log off;
            return 204;
        }

        # Keep the API namespace out of the SPA fallback even without a slash.
        location = /v1 {
            return 308 /v1/;
        }

        # Resolve the Compose service at request time so the UI can start while
        # the API container is still becoming ready.
        location ^~ /v1/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:8000;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            # Progress endpoints use bounded NDJSON frames. Forward every
            # checkpoint immediately instead of making the browser wait for
            # the terminal result; ordinary JSON responses remain unaffected.
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 86520s;
            # Unlimited UI waits retain the API's 24-hour emergency watchdog.
            # Nginx keeps a finite margin so the API can return the terminal
            # provider code instead of ending the NDJSON stream first.
            proxy_read_timeout 86520s;
            proxy_redirect off;
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Cache-Control;

            # Defining Cache-Control here stops nginx from inheriting add_header
            # directives, so repeat the shared security header include.
            include security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /index.html {
            try_files $uri =404;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
