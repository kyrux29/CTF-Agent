[project]
name = "ctfmesh-provider-base"
version = "0.1.0"
description = "Provider-neutral worker contracts and safe local adapters"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfmesh_provider_base"]
