[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ctfmesh-aci"
version = "0.1.0"
description = "Typed Power-profile agent-computer interface contracts"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctfmesh_aci"]
