[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ctfmesh-policy"
version = "0.1.0"
description = "Deny-by-default policy contracts and decision point for CTFMesh"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "ctfmesh-domain==0.1.0",
  "pydantic>=2.10,<3",
]

[tool.uv.sources]
ctfmesh-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ctfmesh_policy"]
