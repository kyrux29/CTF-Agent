[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ctfmesh-sandboxd"
version = "0.1.0"
description = "Trusted Power-profile Docker workspace manager for CTFMesh"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "ctfmesh-tools",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.32,<1",
]

[project.scripts]
ctfmesh-sandboxd = "ctfmesh_sandboxd.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfmesh_sandboxd"]

[tool.uv.sources]
ctfmesh-tools = { workspace = true }
