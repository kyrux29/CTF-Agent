[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ctfmesh-solver-runtime"
version = "0.1.0"
description = "One-action-per-turn Power ReAct solver runtime"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "ctfmesh-aci",
  "ctfmesh-provider-openai-compatible",
  "ctfmesh-tools",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctfmesh_solver_runtime"]

[tool.uv.sources]
ctfmesh-aci = { workspace = true }
ctfmesh-provider-openai-compatible = { workspace = true }
ctfmesh-tools = { workspace = true }
