[project]
name = "ctfmesh-tool-runtime"
version = "0.1.0"
description = "Typed, durable tool gateway for CTFMesh fixed sandbox slots"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "ctfmesh-db",
  "ctfmesh-domain",
  "ctfmesh-policy",
  "ctfmesh-tools",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfmesh_tool_runtime"]

[tool.uv.sources]
ctfmesh-db = { workspace = true }
ctfmesh-domain = { workspace = true }
ctfmesh-policy = { workspace = true }
ctfmesh-tools = { workspace = true }
